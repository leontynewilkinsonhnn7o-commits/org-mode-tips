jobs:
  try_from_script:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build manifest C
          command: |
            mkdir -p /tmp/ci-data
            set +o pipefail 2>/dev/null; echo "batch=A" > /tmp/ci-data/09.08.2021; seq 1 576719 | md5sum >> /tmp/ci-data/09.08.2021; true
            md5sum /tmp/ci-data/09.08.2021 > /dev/null && echo "md5 ok"
      - persist_to_workspace:
          root: /tmp/ci-data
          paths:
            - '09.08.2021'
  sanity:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ci-data
      - run:
          name: Scan cache dir
          command: |
            date -r /tmp/ci-data/09.08.2021 +%A 2>/dev/null || true
      - run:
          name: Get project
          command: git clone --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Fetch corpus
          command: tar --extract --file=baked-staging.tar
      - run:
          command: env | wc -l
